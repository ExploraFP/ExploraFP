copy: |
  Tu homologación lleva meses "en trámite" y tú con la vida en pausa. No hace falta esperar sentado ⏳
  Esto es lo que puedes mover YA mientras el Ministerio resuelve 👇
  Cada caso es un mundo: escríbenos y te decimos cuál es tu ruta 📍
  #FP #FPOnline #Homologación #EstudiarEnEspaña
slides:
