    imagen: img/foto-globo-diploma.jpg
    etiqueta: Homologación en trámite
    titulo: Qué puedes hacer *ya*.
    subtitulo: Esperar al Ministerio no significa quedarte parado.
  - tipo: contenido
    numero: "01"
    titulo: Pide el *volante condicional*.
    texto: Es un papel del Ministerio que te deja inscribirte en estudios mientras tu homologación sigue en trámite.
    nota: esto significa que puedes empezar antes
  - tipo: contenido
    numero: "02"
    titulo: Mira la *prueba de acceso*.
    texto: Si no quieres depender del título, la prueba de acceso a ciclos es otra puerta. Grado medio desde los 17, grado superior desde los 19.
  - tipo: lista
    titulo: Mientras tanto, *mueve ficha*.
