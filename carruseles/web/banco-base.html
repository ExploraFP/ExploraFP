<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Banco de carruseles</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Besley:ital,wght@0,500;0,600;0,700;1,500&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --paper:#FAFFFA; --surface:#FFFFFF; --surface2:#F1F4EE; --surface3:#E7EDE3;
  --line:#DBE3D6; --line2:#C2CEBC;
  --ink:#141417; --ink2:#48564A; --ink3:#77857A;
  --brand:#366B40; --brand2:#1B3620; --brandInk:#FAFFFA;
  --lima:#D8FF6E; --limaSoft:#EDFEC3; --limaLine:#B3F265;
  --danger:#C0231E; --dangerSoft:#FFE1E0; --dangerLine:#F1A9A6;
  --warn:#8A5300; --warnSoft:#FFF1CC; --warnLine:#EBC978;
  --ok:#2E7A34; --okSoft:#DCF7D9; --okLine:#9BDE97;
  --focus:#1B3620;
  --sh1:0 1px 2px rgba(20,20,23,.05);
  --sh2:0 2px 4px rgba(27,54,32,.06),0 14px 32px -16px rgba(27,54,32,.32);
  --f-display:"Besley",Georgia,"Times New Roman",serif;
  --f-ui:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0F130F; --surface:#161B16; --surface2:#1D231D; --surface3:#252D25;
  --line:#2C352C; --line2:#3D493D;
  --ink:#E8EFE6; --ink2:#A9B7A8; --ink3:#7E8C7E;
  --brand:#7CC085; --brand2:#0A0F0A; --brandInk:#0A0F0A;
  --limaSoft:#26330F; --limaLine:#4E6B22;
  --danger:#FF7A72; --dangerSoft:#3A1715; --dangerLine:#6E2A26;
  --warn:#FFC94A; --warnSoft:#332508; --warnLine:#6B4F13;
  --ok:#8AE182; --okSoft:#153417; --okLine:#2E5F31;
  --focus:#D8FF6E;
  --sh1:0 1px 2px rgba(0,0,0,.4); --sh2:0 2px 4px rgba(0,0,0,.3),0 14px 32px -16px rgba(0,0,0,.7);
}}
:root[data-theme="dark"]{
  --paper:#0F130F; --surface:#161B16; --surface2:#1D231D; --surface3:#252D25;
  --line:#2C352C; --line2:#3D493D;
  --ink:#E8EFE6; --ink2:#A9B7A8; --ink3:#7E8C7E;
  --brand:#7CC085; --brand2:#0A0F0A; --brandInk:#0A0F0A;
  --limaSoft:#26330F; --limaLine:#4E6B22;
  --danger:#FF7A72; --dangerSoft:#3A1715; --dangerLine:#6E2A26;
  --warn:#FFC94A; --warnSoft:#332508; --warnLine:#6B4F13;
  --ok:#8AE182; --okSoft:#153417; --okLine:#2E5F31;
  --focus:#D8FF6E;
  --sh1:0 1px 2px rgba(0,0,0,.4); --sh2:0 2px 4px rgba(0,0,0,.3),0 14px 32px -16px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--brand);text-underline-offset:2px}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* ---------- barra ---------- */
.top{position:sticky;top:0;z-index:40;background:var(--brand2);color:#EAF3E8}
.top-in{display:flex;align-items:center;gap:20px;padding:11px 24px;flex-wrap:wrap;max-width:1680px;margin:0 auto}
.mark{display:flex;align-items:baseline;gap:11px;min-width:0}
.mark b{font-family:var(--f-display);font-weight:700;font-size:18.5px;letter-spacing:-.35px;color:#fff}
.mark b i{font-style:italic;color:var(--lima);font-weight:500}
.mark span{font-size:10px;color:#9FB79E;font-family:var(--f-mono);white-space:nowrap;
  text-transform:uppercase;letter-spacing:.14em;padding-left:11px;border-left:1px solid rgba(255,255,255,.18)}
.mark span em{font-style:normal;color:var(--lima);margin:0 1px}
.views{display:flex;gap:2px;background:rgba(255,255,255,.07);padding:3px;border-radius:9px}
.views button{background:none;border:0;color:#B9CCB7;padding:5px 14px;border-radius:6px;font-size:13px;font-weight:500}
.views button:hover{color:#fff}
.views button[aria-current="true"]{background:var(--lima);color:#12200F;font-weight:600}
.top-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.icon-btn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:#D3E2D1;border-radius:7px;padding:6px 10px;font-size:12.5px}
.icon-btn:hover{background:rgba(255,255,255,.16);color:#fff}
.canvas{max-width:1680px;margin:0 auto;padding:22px 24px 100px}

/* ---------- ritmo + buscador + filtros ---------- */

.buscador input{width:100%;max-width:860px;padding:13px 16px;background:var(--surface);border:1px solid var(--line2);
  border-radius:11px;font-size:15px;box-shadow:var(--sh1)}
.buscador input:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px var(--limaSoft)}
.filtros{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin:12px 0 4px}
.fchip{border:1px solid var(--line2);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:12.5px;color:var(--ink2)}
.fchip:hover{border-color:var(--brand)}
.fchip b{font-family:var(--f-mono);font-weight:600;margin-left:5px;color:var(--ink3)}
.fchip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brandInk);font-weight:600}
.fchip[aria-pressed="true"] b{color:var(--limaSoft)}
.fchip.destacado{border-color:var(--limaLine);background:var(--limaSoft);color:var(--ink);font-weight:600}
.fchip.destacado[aria-pressed="true"]{background:var(--brand2);border-color:var(--brand2);color:var(--lima)}
.fchip.destacado[aria-pressed="true"] b{color:var(--lima)}
.fchip.limpiar{border-style:dashed;color:var(--ink3)}
.fsel{border:1px solid var(--line2);background:var(--surface);border-radius:999px;padding:6px 11px;font-size:12.5px;color:var(--ink2);max-width:190px}
.cuenta{font-size:12.5px;color:var(--ink3);margin:10px 0}

/* ---------- lista ---------- */
.lista{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.fila{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;
  padding:13px 15px;border-bottom:1px solid var(--line)}
.fila:last-child{border-bottom:0}
.fila:hover{background:var(--surface2)}
.fila.sel{background:var(--limaSoft)}
.fila.ok{background:linear-gradient(90deg,var(--okSoft) 0 3px,transparent 3px)}
.fila.ok .tit{color:var(--ink2)}
.celda{background:none;border:0;padding:0;text-align:left;color:inherit;width:100%;display:block;cursor:pointer}
.celda .tit{font-family:var(--f-display);font-size:15.5px;font-weight:600;line-height:1.3;letter-spacing:-.15px;display:block}
.celda:hover .tit{text-decoration:underline;text-underline-offset:3px}
.celda .meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:6px}
.acciones{display:flex;gap:7px;flex:none}
.enlace{grid-column:1/-1;display:flex;gap:9px;align-items:center;margin-top:2px}
.enlace input{flex:1;padding:7px 11px;background:var(--surface2);border:1px solid var(--line);border-radius:7px;font-size:12.5px}
.enlace input:focus{border-color:var(--brand);outline:none}
.enlace a{font-size:12.5px;white-space:nowrap}
@media(max-width:720px){
  .fila{grid-template-columns:minmax(0,1fr)}
  .acciones{width:100%}
  .acciones .btn{flex:1}
}
.btn{border:1px solid var(--line2);background:var(--surface);border-radius:8px;padding:7px 13px;
  font-size:13px;font-weight:500;box-shadow:var(--sh1);white-space:nowrap;display:inline-block;text-decoration:none;color:inherit}
.btn:hover{background:var(--surface2)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brandInk);font-weight:600}
.btn.pri:hover{filter:brightness(1.1)}
.btn.hecho.on{background:var(--okSoft);border-color:var(--okLine);color:var(--ok);font-weight:600}
.vacio{padding:48px 20px;text-align:center;color:var(--ink3);font-size:13.5px;border:1px dashed var(--line2);border-radius:12px}
.vacio b{display:block;font-family:var(--f-display);font-size:17px;color:var(--ink2);margin-bottom:6px;font-weight:600}

/* ---------- chips ---------- */
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:6px;padding:3px 9px;font-size:12px;
  font-weight:600;letter-spacing:0;border:1px solid transparent;white-space:nowrap;line-height:1.35}
.s-sinempezar{background:var(--surface3);color:var(--ink2);border-color:var(--line2)}
.s-planificada{background:transparent;color:var(--brand);border:1px dashed var(--brand)}
.s-hecha{background:var(--okSoft);color:var(--ok);border-color:var(--okLine)}
.s-descartada{background:transparent;color:var(--ink3);border-color:var(--line);text-decoration:line-through}
.v-ALTO{background:var(--dangerSoft);color:var(--danger);border-color:var(--dangerLine)}
.v-MEDIO{background:var(--warnSoft);color:var(--warn);border-color:var(--warnLine)}
.f-TOFU{color:var(--ink2);border-color:var(--line2);background:var(--surface2)}
.f-MOFU{color:#2B5E8A;border-color:#A9C6DE;background:#E4F0F9}
.f-BOFU{background:var(--brand2);color:var(--lima);border-color:var(--brand2)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .f-MOFU{color:#8FC3E8;border-color:#28455C;background:#122230}
:root:not([data-theme="light"]) .f-BOFU{background:var(--limaSoft);color:var(--lima);border-color:var(--limaLine)}}
:root[data-theme="dark"] .f-MOFU{color:#8FC3E8;border-color:#28455C;background:#122230}
:root[data-theme="dark"] .f-BOFU{background:var(--limaSoft);color:var(--lima);border-color:var(--limaLine)}
.bloq{background:var(--dangerSoft);color:var(--danger);border-color:var(--dangerLine)}
.temp{background:var(--limaSoft);color:var(--brand);border-color:var(--limaLine)}
.nueva{background:var(--brand);color:var(--brandInk);border-color:var(--brand)}
.tag{font-size:11.5px;color:var(--ink3);text-transform:none;letter-spacing:0}

/* ---------- datos ---------- */
.vhead{margin-bottom:14px}
.vhead h2{font-family:var(--f-display);font-size:21px;font-weight:600;letter-spacing:-.2px;margin:0}
.vhead p{margin:5px 0 0;color:var(--ink3);font-size:13px;max-width:66ch}
.aviso-fila{display:flex;gap:10px;border-radius:9px;padding:10px 13px;font-size:13px;flex-wrap:wrap}
.aviso-fila.rojo{border:1px solid var(--dangerLine);background:var(--dangerSoft);color:var(--danger)}
.aviso-fila.ambar{border:1px solid var(--warnLine);background:var(--warnSoft);color:var(--warn)}
.datos{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));align-items:start}
.dato{border:1px solid var(--line);border-radius:11px;background:var(--surface);padding:13px 14px;display:flex;flex-direction:column;gap:8px}
.dato.conflicto{border-color:var(--dangerLine);background:var(--dangerSoft)}
.dato h3{margin:0;font-family:var(--f-display);font-size:15.5px;font-weight:600;line-height:1.25}
.dato .dtop{display:flex;align-items:center;gap:8px}
.dato .did{font-family:var(--f-mono);font-size:11px;color:var(--ink3);font-weight:600}
.dato .frase{font-size:13px}
.dato dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 10px;font-size:12px}
.dato dt{color:var(--ink3);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;font-weight:700;padding-top:2px}
.dato dd{margin:0;color:var(--ink2)}
.dato .aviso{border-left:2px solid var(--warnLine);background:var(--warnSoft);color:var(--warn);padding:7px 10px;border-radius:0 7px 7px 0;font-size:12px}
.dato.conflicto .aviso{border-left-color:var(--dangerLine);background:transparent;color:var(--danger)}
.dato .vinc{font-size:11.5px;color:var(--ink3);font-family:var(--f-mono);margin:0}
.dato .vinc button{background:none;border:0;padding:0 2px;color:var(--brand);font-family:var(--f-mono);font-size:11.5px;text-decoration:underline}

/* ---------- ficha ---------- */
.velo{position:fixed;inset:0;background:rgba(12,20,12,.42);z-index:60;opacity:0;pointer-events:none;transition:opacity .16s}
.velo.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(500px,100vw);background:var(--surface);
  border-left:1px solid var(--line);z-index:61;transform:translateX(101%);transition:transform .2s ease;
  display:flex;flex-direction:column;box-shadow:var(--sh2)}
.drawer.on{transform:none}
@media(prefers-reduced-motion:reduce){.drawer,.velo{transition:none}}
.dhead{padding:13px 15px;border-bottom:1px solid var(--line);background:var(--surface2)}
.dhead .drow{display:flex;align-items:center;gap:7px;margin-bottom:8px;flex-wrap:wrap}
.dhead h2{margin:0;font-family:var(--f-display);font-size:20px;font-weight:600;line-height:1.22;letter-spacing:-.25px;text-wrap:balance}
.dclose{margin-left:auto;background:none;border:1px solid var(--line2);border-radius:6px;width:27px;height:27px;line-height:1;color:var(--ink2)}
.dbody{overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:17px}
.sec>h4{margin:0 0 8px;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink3);font-weight:700}
.quote{border-left:3px solid var(--limaLine);padding:2px 0 2px 12px;font-family:var(--f-display);font-size:15px;font-style:italic;line-height:1.4;margin:0}
.campos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.campo{display:flex;flex-direction:column;gap:4px}
.campo label{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);font-weight:700}
.campo input,.campo select,.campo textarea{padding:7px 9px;background:var(--surface2);border:1px solid var(--line);border-radius:7px;font-size:13px;width:100%}
.campo.full{grid-column:1/-1}
.campo textarea{resize:vertical;min-height:58px;font-family:inherit}
.checklist{display:flex;flex-direction:column;gap:7px}
.checklist label{display:flex;gap:9px;align-items:flex-start;font-size:13px;color:var(--ink2);cursor:pointer;line-height:1.35}
.checklist input{margin-top:2px;accent-color:var(--brand);flex:none}
.checklist label.hecho{color:var(--ink3);text-decoration:line-through}
.alerta{border:1px solid var(--dangerLine);background:var(--dangerSoft);color:var(--danger);border-radius:9px;padding:10px 12px;font-size:13px}
.alerta b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}
.aviso-b{border:1px solid var(--warnLine);background:var(--warnSoft);color:var(--warn);border-radius:9px;padding:10px 12px;font-size:12.5px}
.aviso-b b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
.dfoot{border-top:1px solid var(--line);padding:11px 15px;display:flex;gap:8px;background:var(--surface2);flex-wrap:wrap}
.dfoot .btn{flex:1;text-align:center}

/* ---------- ayuda ---------- */
.onb{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:18px;background:rgba(10,16,10,.55)}
.onb[hidden]{display:none}
.onbcaja{background:var(--surface);border:1px solid var(--line);border-radius:14px;max-width:520px;width:100%;
  box-shadow:var(--sh2);overflow:hidden;max-height:88vh;display:flex;flex-direction:column}
.onbcaja header{padding:17px 19px 0}
.onbcaja header k{font-family:var(--f-mono);font-size:11px;color:var(--ink3);letter-spacing:.06em}
.onbcaja h2{margin:5px 0 0;font-family:var(--f-display);font-size:21px;font-weight:600;letter-spacing:-.3px}
.onbcaja .cuerpo{padding:13px 19px 17px;overflow-y:auto;font-size:13.5px;color:var(--ink2);line-height:1.55}
.onbcaja .cuerpo p{margin:0 0 10px}
.onbcaja .cuerpo b{color:var(--ink)}
.onbcaja ul{margin:0 0 10px;padding-left:19px}
.onbcaja li{margin-bottom:6px}
.onbcaja footer{display:flex;gap:8px;align-items:center;padding:12px 19px;border-top:1px solid var(--line);background:var(--surface2)}
.puntos{display:flex;gap:5px;margin-right:auto}
.puntos i{width:7px;height:7px;border-radius:50%;background:var(--line2);display:block}
.puntos i.on{background:var(--brand)}
.glos{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 13px;font-size:13px;margin:0}
.glos dt{font-weight:700;color:var(--ink)}
.glos dd{margin:0;color:var(--ink2)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--brand2);
  color:var(--lima);padding:10px 18px;border-radius:9px;font-size:13px;z-index:80;opacity:0;pointer-events:none;
  transition:all .18s;box-shadow:var(--sh2);max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}

.fila.inv{background:none}
.fila.inv .celda{cursor:default}
.fila.inv .celda:hover .tit{text-decoration:none}
.invbusca{flex:1;min-width:190px;padding:7px 13px;background:var(--surface);border:1px solid var(--line2);border-radius:999px;font-size:12.5px}
.invbusca:focus{border-color:var(--brand);outline:none}
.btn.sinenlace{color:var(--ink3);border-style:dashed;box-shadow:none;background:none;cursor:default}
.onbcaja .campos{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.onbcaja .campo.full{grid-column:1/-1}

.mherror{margin:11px 0 0;padding:8px 11px;border:1px solid var(--dangerLine);background:var(--dangerSoft);
  color:var(--danger);border-radius:8px;font-size:12.5px}
.urlhecho{margin:0 0 10px;font-size:12.5px;word-break:break-all}

.quien{margin:0 0 10px;font-size:14px;line-height:1.4}
.etiquetas{display:flex;flex-wrap:wrap;gap:7px}
.et{border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:5px 10px;font-size:12.5px;line-height:1.3}
.et k{display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink3);font-weight:700}
.google{margin:10px 0 0}
.google k{display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink3);font-weight:700;margin-bottom:3px}
.google span{display:inline-block;background:var(--surface2);border:1px solid var(--line);border-radius:7px;
  padding:5px 10px;font-size:12.5px;color:var(--ink2)}
.cuidados{margin:0;padding-left:17px;display:flex;flex-direction:column;gap:6px}
.cuidados li{font-size:12.5px;color:var(--ink2);line-height:1.4}
.cuidados li::marker{color:var(--warn)}
.apoyo{margin:0;font-size:12.5px;color:var(--ink2)}

/* ---------- matriz de ideas ---------- */
.tablawrap{border:1px solid var(--line);border-radius:12px;overflow-x:auto;background:var(--surface)}
.matriz{table-layout:fixed}
.matriz{border-collapse:collapse;width:100%;font-size:13px}
.matriz thead th{position:sticky;top:0;z-index:2;background:var(--surface2);border-bottom:1px solid var(--line2);
  text-align:left;padding:0;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink3);font-weight:700}
.matriz thead th.c-que,.matriz thead th.c-dato,.matriz thead th.c-acc{padding:10px 12px}
.matriz thead .th{background:none;border:0;padding:10px 12px;width:auto;text-align:left;color:inherit;white-space:nowrap;
  font:inherit;letter-spacing:inherit;text-transform:inherit}
.matriz thead .th{white-space:normal;line-height:1.3}
.matriz thead .th:hover,.matriz thead .th.on{color:var(--brand)}
.matriz thead .th.on::after{content:" ↓"}
.matriz td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.matriz tbody tr:last-child td{border-bottom:0}
.matriz tbody tr:hover td{background:var(--surface2)}
.matriz tbody tr.sel td{background:var(--limaSoft)}
.matriz .celda{font-family:var(--f-display);font-size:14.5px;font-weight:600;line-height:1.3;letter-spacing:-.1px;
  background:none;border:0;padding:0;text-align:left;color:inherit;cursor:pointer}
.matriz .celda:hover{text-decoration:underline;text-underline-offset:3px}
.matriz .acciones{display:flex;gap:6px}

lidad, y cambian.","ideas":["T29"],"ideasSug":[]},{"id":"D04","tema":"Acceso Grado Medio → Grado Superior","frase":"Tener un título de Técnico (Grado Medio) da acceso directo a Grado Superior. No hace falta prueba ni bachillerato.","norma":"Real Decreto 659/2023, de 18 de julio (arts. 108-115), que desarrolla la ordenación del Sistema de FP.","fuente":"BOE · Educalia · Fundación Sopeña","url":"https://www.boe.es/buscar/doc.php?id=BOE-A-2023-16889","consultado":"sept. 2026","confianza":"ALTA","cubre":"TRANSVERSAL 10 · POR CICLO SMR, ASIR, DAM/DAW, Gestión Administrativa","uso":"Rompe la creencia «con el medio me quedo estancado» con una sola frase y la norma citada.","aviso":"La admisión depende de plazas y cupos: acceder no es lo mismo que conseguir plaza en cualquier ciclo.","ideas":["T10"],"ideasSug":["T09"]},{"id":"D05","tema":"Acceso a Grado Medio","frase":"Con la ESO se entra directo. Sin ella hay tres puertas más: Técnico Básico, prueba de acceso (17 años cumplidos en el año) o curso preparatorio.","norma":"RD 659/2023. También accede quien tenga un certificado profesional de grado C incluido en el ciclo.","fuente":"Educalia · Fundación Sopeña · BOE","url":"https://www.boe.es/buscar/doc.php?id=BOE-A-2023-16889","consultado":"sept. 2026","confianza":"ALTA","cubre":"TRANSVERSAL 8, 13 · POR RAMA (mapas de entrada) · POR CICLO SMR, Gestión Administrativa","uso":"El molde de mapa de puertas está hecho para este dato: una vía por slide.","aviso":"Las convocatorias de prueba y los cursos preparatorios los fija cada CCAA.","ideas":["T08","T13","C001","B030","B037"],"ideasSug":["T09","T14","B019","B054"]},{"id":"D06","tema":"Universidad desde Grado Superior","frase":"La nota media del ciclo es la nota de acceso. No hay que hacer la fase general de la EBAU. La fase específica es voluntaria y sube la nota.","norma":"La fase específica pondera un máximo de dos materias (0,1 o 0,2 cada una) y suma hasta 4 puntos: máximo 14, igual que desde bachillerato. Ya no existe cupo de plazas reservado para FP.","fuente":"Cesur · Adams · Ilerna","url":"https://www.adams.es/noticias/formacion-profesional/acceso-universidad-grado-superior-fp/","consultado":"sept. 2026","confianza":"ALTA","cubre":"TRANSVERSAL 61 · POR CICLO Laboratorio, Anatomía, Educación Infantil, AyF, Asistencia · POR BUYER Diego, Álvaro, Jully, Alberto","uso":"Es EL dato del arquetipo trampolín. Slide 2: tu media es tu nota. Slide 3: y puedes subir hasta 14.","aviso":"Las ponderaciones las fija cada universidad y hay ramas de acceso preferente. Remite siempre a la web de la universidad de destino.","ideas":["T61","C117","B055"],"ideasSug":["T23","R010","R018","R040","R048","C040","C047","C104","C106","C130","B007","B012","B014","B060"]},{"id":"D07","tema":"Inserción laboral en FP","frase":"Al año de titularse trabaja el 36,2% en Grado Medio y el 51,1% en Grado Superior. En dual de Grado Superior sube al 54,7% el primer año.","norma":"Encuesta de Inserción Laboral de titulados de FP, titulación 2020-2021, publicada por el Ministerio de Educación, FP y Deportes en noviembre de 2025. A cuatro años, cerca del 80% en dual de GS.","fuente":"Ministerio de Educación, FP y Deportes","url":"https://www.educacionfpydeportes.gob.es/prensa/actualidad/2025/11/20251126-insercionlaboralfp.html","consultado":"sept. 2026","confianza":"ALTA","cubre":"TRANSVERSAL 54 · POR RAMA (¿tiene salida?) · Contra el humo","uso":"Fuente y año DENTRO de la slide. Es tasa de afiliación de una promoción concreta, no una promesa.","aviso":"Nunca lo conviertas en «X de cada 10 encuentran trabajo con nosotros». Es dato del sistema, no de Explora.","ideas":["T54"],"ideasSug":["B010","B025"]},{"id":"D08","tema":"Volumen de FP en España","frase":"La FP marca récord histórico: 1.211.062 matriculados en el curso 2025-2026, un 2,5% más que el anterior.","norma":"Estadística de las Enseñanzas no universitarias, datos de avance 2025-2026, publicada el 31 de julio de 2026.","fuente":"Ministerio de Educación, FP y Deportes","url":"https://www.educacionfpydeportes.gob.es/prensa/actualidad/2026/07/20260731-datosavance.html","consultado":"sept. 2026","confianza":"ALTA","cubre":"TRANSVERSAL (contexto de sector) · POR RAMA","uso":"Dato de apertura para piezas de «la FP ya no es el plan B».","aviso":"Es matrícula total, incluye Grado Básico. No lo presentes como demanda de empleo.","ideas":[],"ideasSug":[]},{"id":"D09","tema":"Perfil de quien estudia FP a distancia","frase":"En la FP a distancia las mujeres son mayoría clara: 65,0% en Grado Medio y 61,6% en Grado Superior, al revés que en la presencial.","norma":"Estadística de las Enseñanzas no universitarias, MEFPD. En FP presencial las mujeres son el 42,7% en GM y el 45,3-45,8% en GS.","fuente":"Ministerio de Educación, FP y Deportes","url":"https://www.educacionfpydeportes.gob.es/prensa/actualidad/2026/07/20260731-datosavance.html","consultado":"sept. 2026","confianza":"ALTA","cubre":"POR BUYER (arquetipos femeninos) · POR RAMA Servicios Socioculturales","uso":"Útil para la pieza «¿es una rama solo de mujeres?» y para segmentar creatividades.","aviso":"Es dato de matrícula, no de abandono ni de empleo.","ideas":[],"ideasSug":["R049"]},{"id":"D10","tema":"Transportista","frase":"El título de Técnico Superior en Transporte y Logística da el certificado de competencia profesional de mercancías Y viajeros SIN examen.","norma":"RD 1572/2011, de 4 de noviembre. Se solicita a la consejería de transportes de tu CCAA, aportando el título y abonando la tasa de expedición de cada modalidad.","fuente":"Comunidad de Madrid · Dirección General de Movilidad (Baleares)","url":"https://www.comunidad.madrid/servicios/transporte/certificado-competencia-profesional-transporte","consultado":"sept. 2026","confianza":"ALTA","cubre":"POR CICLO Transporte y Logística (C050) · POR BUYER José Miguel, Mariana","uso":"Esto es un argumento de venta enorme y estaba mal planteado en la matriz: el ciclo SÍ te evita el examen de transportista.","aviso":"El certificado no Aroa, Sonia","uso":"Pieza de servicio puro: qué es, dónde se pide, cuánto cuesta (nada), en cuánto lo tienes.","aviso":"No es un requisito para matricularse, sino para trabajar. No lo mezcles con el acceso al ciclo.","ideas":["C113","C114","C115","C116","C117","C118","C119","C120","B053","B054","B055","B056"],"ideasSug":["T49","R045"]},{"id":"D13","tema":"Becas MEC","frase":"La beca general del Ministerio cubre ciclos de Grado Medio y Superior. En la convocatoria 2026-2027 el plazo fue del 7 de abril al 19 de mayo de 2026.","norma":"Convocatoria anual del Ministerio de Educación, FP y Deportes. Requisitos económicos y académicos simultáneos.","fuente":"Ministerio de Educación · CaixaBank · varios centros","url":"https://www.becaseducacion.gob.es/becas-y-ayudas/","consultado":"sept. 2026","confianza":"BAJA · CONFLICTO","cubre":"TRANSVERSAL 23 · POR CICLO SMR · POR BUYER Fran","uso":"NO publiques nada de becas hasta resolver el conflicto. Es el dato con más riesgo de queja del alumno.","aviso":"Las fuentes se contradicen sobre si un centro privado NO concertado da derecho a la beca general. Algunas convocatorias limitan ciertos supuestos a centros públicos o privados concertados. Hay que leer la convocatoria en el BOE y confirmar con dirección.","ideas":["T23","B031"],"ideasSug":[]},{"id":"D14","tema":"Fin de la FCT","frase":"La formación en empresa deja de ser un bloque al final del ciclo y pasa a estar integrada dentro de la formación.","norma":"LO 3/2022. La FP dual sustituye el antiguo módulo de FCT, que se realizaba al final de los ciclos.","fuente":"Esemtia · Alianza para la FP Dual","url":"https://esemtia.com/tendencias-fp-dual-2025-2026/","consultado":"sept. 2026","confianza":"ALTA","cubre":"TRANSVERSAL 27 · toda la matriz (regla de vocabulario)","uso":"Justifica la regla interna: nunca escribimos FCT. En orgánico, «formación en empresa dentro del ciclo».","aviso":"Mucha gente y muchos centros siguen diciendo FCT. No corrijas al usuario en la pieza: explica el cambio.","ideas":["T27"],"ideasSug":["T28","T29","T30","T31","T32","T33","T41","R019","C037","C116"]},{"id":"D15","tema":"FP online y validez","frase":"La FP a distancia tiene carácter oficial y la misma validez académica que la presencial. La fase práctica en empresa sí es presencial.","norma":"Ordenación de la FP a distancia. El teletrabajo en la formación en empresa solo se admite de forma puntual y si el sector lo permite, recogido en el plan individual de formación.","fuente":"Esemtia","url":"https://esemtia.com/tendencias-fp-dual-2025-2026/","consultado":"sept. 2026","confianza":"MEDIA","cubre":"TRANSVERSAL 5, 41 · POR CICLO (todas las de «¿se puede online?»)","uso":"Es la respuesta honesta a la objeción número uno: la teoría sí, la empresa se pisa.","aviso":"Confirmar la parte de teletrabajo en la normativa autonómica antes de afirmarla.","ideas":["T05","T41"],"ideasSug":["T06","T55","R011","C062","B037","B054","B061","B062"]},{"id":"D16","tema":"Continuidad tras el ciclo","frase":"El 65,2% de los titulados en Grado Básico accedieron a un ciclo de Grado Medio en los tres años siguientes.","norma":"Estadística de Seguimiento Educativo Posterior de titulados de FP, MEFPD, noviembre de 2025. En dual de GM la continuidad educativa fue del 54,9% frente al 50,0% de la no dual.","fuente":"Ministerio de Educación, FP y Deportes","url":"https://www.educacionfpydeportes.gob.es/prensa/actualidad/2025/11/20251126-insercionlaboralfp.html","consultado":"sept. 2026","confianza":"ALTA","cubre":"TRANSVERSAL 10, 61 · piezas de itinerario","uso":"Sostiene el argumento del itinerario: la gente encadena ciclos, no se queda en uno.","aviso":"Es continuidad educativa, no empleabilidad. No lo uses como prueba de que el itinerario da más trabajo.","ideas":["T10","T61"],"ideasSug":["T48","R010","R041","B032","B059"]}],"formaciones":["ASIR","Administración y Finanzas","Anatomía Patológica y Citodiagnóstico","Asistencia a la Dirección","Comercio Internacional","DAM","DAW","Dietética","Doble Admin. y Finanzas + Asistencia","Doble Comercio Int. + Transporte","Doble DAM + DAW","Doble Laboratorio + Anatomía","Educación Infantil","Gestión Administrativa","Laboratorio Clínico y Biomédico","Marketing y Publicidad","SMR","TCAE","Transporte y Logística"],"momentos":[{"k":"sinplaza","n":"Sin plaza, con el curso empezado","meses":[8,9,10],"pasa":"Se publican adjudicaciones y listas de espera. Mucha gente se queda fuera del presencial o llega tarde al plazo.","empuja":"Que quedarse fuera no cierra el año. Las vías que siguen abiertas hoy.","mix":{"TOFU":25,"MOFU":40,"BOFU":35}},{"k":"arranque","n":"El curso arranca","meses":[9,10],"pasa":"Empiezan las clases. Quien no se movió en julio ve arrancar el curso desde fuera.","empuja":"Que la FP online no comparte calendario con el instituto y se puede entrar ahora.","mix":{"TOFU":25,"MOFU":40,"BOFU":35}},{"k":"caida","n":"Se está cayendo el curso","meses":[10,11,12],"pasa":"Aparece el arrepentimiento temprano: horarios imposibles, ciclo equivocado, primeras bajas.","empuja":"Compatibilizar de verdad, cambiar de ciclo sin perderlo todo, sostener el avance.","mix":{"TOFU":20,"MOFU":55,"BOFU":25}},{"k":"precio","n":"Comparar y pagar","meses":[11,12,1],"pasa":"Se comparan centros y se mira el bolsillo antes de comprometerse.","empuja":"Precio real sin letra pequeña, financiación, cómo distinguir un centro oficial.","mix":{"TOFU":20,"MOFU":45,"BOFU":35}},{"k":"enero","n":"Segundo arranque","meses":[1,2],"pasa":"Propósitos y cambios de sector. El otro gran pico de decisión del año.","empuja":"Empezar de cero, reconvertirse, el primer paso concreto.","mix":{"TOFU":35,"MOFU":40,"BOFU":25}},{"k":"convalidar","n":"Convalidar y acreditar","meses":[2,3,4],"pasa":"Quien ya estudió o ya trabaja busca no repetir lo que sabe.","empuja":"Convalidaciones, acreditación de experiencia, homologación de títulos de fuera.","mix":{"TOFU":30,"MOFU":50,"BOFU":20}},{"k":"becas","n":"Becas y trámites","meses":[4,5],"pasa":"Se abre la convocatoria de becas del Ministerio y arrancan los trámites del curso siguiente.","empuja":"Requisitos, documentación exacta, plazos. Con la fuente en la slide.","mix":{"TOFU":35,"MOFU":50,"BOFU":15}},{"k":"admision","n":"Admisión y notas","meses":[5,6,7],"pasa":"Solicitud de plaza en presencial, notas, acceso a universidad desde Grado Superior.","empuja":"Cómo funciona el acceso, qué nota hace falta, qué abre cada título.","mix":{"TOFU":45,"MOFU":45,"BOFU":10}},{"k":"verano","n":"Decidir en verano","meses":[6,7,8],"pasa":"Tiempo para pensar: qué ciclo, qué salidas, cuánto se cobra.","empuja":"Mapas de ramas, salidas reales, comparativas entre ciclos.","mix":{"TOFU":50,"MOFU":40,"BOFU":10}}],"meses":["","enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"]};</script>

<script>
/* ===================== modelo ===================== */
const IDEAS = CATALOGO.ideas, DATOS = CATALOGO.datos, CANON = CATALOGO.formaciones;
const MOMENTOS = CATALOGO.momentos, MESES = CATALOGO.meses;
const MMAP = {}; MOMENTOS.forEach(m => MMAP[m.k] = m);
const DMAP = {}; DATOS.forEach(d => DMAP[d.id] = d);
const IMAP = {}; IDEAS.forEach(i => IMAP[i.id] = i);

/* Tres situaciones, no siete estados:
   sin empezar · planificada (tiene día) · hecha (tiene carrusel).      */
const FN = {TOFU:'TOFU', MOFU:'MOFU', BOFU:'BOFU'};
const FN_PISTA = {
  TOFU:'TOFU · atrae: le habla a quien todavía no sabe que la FP online existe para él',
  MOFU:'MOFU · convence: le habla a quien ya se lo plantea y está comparando',
  BOFU:'BOFU · cierra: le habla a quien está a un paso y necesita perder el último miedo'};
const CTAS = ['Trazar mi ruta 📍','Ver por dentro ⚔️','Recalcular la ruta 🧭','Ver mi plan 🔥'];
const CONSULTA = 'septiembre de 2026', CADUCA = new Date('2027-03-01T00:00:00');
const VACIA = {hecho:false, descartada:false, resp:'', canal:'', fecha:'', url:'', notas:'', checks:{}};

const S = {v:'ideas', q:'', sel:null, ops:{}, modo:'local', orden:'alcance',
           f:{rama:'', form:'', cif:''},
           t:{solo:false}};

/* ===================== utilidades ===================== */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
/* versión 1 a 1: mantiene la longitud, así los índices sirven para resaltar */
const ACENTO = {'á':'a','é':'e','í':'i','ó':'o','ú':'u','ü':'u','ñ':'n','ç':'c'};
const llano = s => String(s || '').toLowerCase().replace(/[áéíóúüñç]/g, c => ACENTO[c]);
function trozosBusqueda(){
  return norm(S.q).split(/\s+/).map(t => t.trim()).filter(t => t.length > 1);
}
/* resalta en el texto original los trozos que se han buscado */
function marca(txt, tokens){
  const t = String(txt == null ? '' : txt);
  if (!tokens || !tokens.length) return esc(t);
  const plano = llano(t), rangos = [];
  tokens.forEach(tok => {
    let i = plano.indexOf(tok);
    while (i >= 0){ rangos.push([i, i + tok.length]); i = plano.indexOf(tok, i + tok.length); }
  });
  if (!rangos.length) return esc(t);
  rangos.sort((a,b) => a[0] - b[0]);
  const fus = [];
  rangos.forEach(r => {
    const u = fus[fus.length-1];
    if (u && r[0] <= u[1]) u[1] = Math.max(u[1], r[1]); else fus.push([r[0], r[1]]);
  });
  let out = '', pos = 0;
  fus.forEach(r => { out += esc(t.slice(pos, r[0])) + '<mark>' + esc(t.slice(r[0], r[1])) + '</mark>'; pos = r[1]; });
  return out + esc(t.slice(pos));
}
function op(id){
  const raw = S.ops[id] || {};
  const o = Object.assign({}, VACIA, raw, {checks: Object.assign({}, raw.checks)});
  if (raw.estado && typeof raw.hecho === 'undefined'){   // datos de la versión anterior
    o.hecho = raw.estado === 'publicada';
    o.descartada = raw.estado === 'descartada';
  }
  return o;
}
function sit(id){
  const o = op(id);
  if (o.descartada) return 'descartada';
  if (o.hecho) return 'hecha';
  if (o.fecha) return 'planificada';
  return 'sinempezar';
}
const hoy = () => new Date();
function fISO(d){ return d.toISOString().slice(0,10); }
function lunes(d){ const x = new Date(d); const g = (x.getDay()+6)%7; x.setDate(x.getDate()-g); x.setHours(0,0,0,0); return x; }
function fCorta(iso){ if(!iso) return ''; return new Date(iso+'T00:00:00').toLocaleDateString('es-ES',{day:'2-digit',month:'short'}); }
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove('on'), 2600); }
function copiar(txt, msg){
  const ok = () => toast(msg || 'Copiado');
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(ok, fallback);
  else fallback();
  function fallback(){
    const ta = document.createElement('textarea'); ta.value = txt;
    ta.style.cssText = 'position:fixed;top:-9999px'; document.body.appendChild(ta);
    ta.select(); try { document.execCommand('copy'); ok(); } catch(e){ toast('No he podido copiar'); }
    ta.remove();
  }
}

/* ===================== persistencia ===================== */
let DB = null, DOWN = null;
function setModo(m, nota){
  S.modo = m;
  // sin aviso en pantalla: si la base compartida falla, se sigue guardando
  // en este navegador y la traza queda en la consola.
  if (m !== 'equipo' && nota) try { console.info('[sala] ' + nota); } catch(e){}
}
async function conectar(){
  try { if (typeof claude !== 'undefined' && claude.use) DB = await claude.use('db'); } catch(e){ DB = null; }
  try { if (typeof claude !== 'undefined' && claude.use) DOWN = await claude.use('downloads'); } catch(e){ DOWN = null; }
  if (!DB){ setModo('local'); return; }
  DB.collection('ops').onSnapshot(snap => {
    const m = {};
    snap.docs.forEach(d => { const v = d.data(); if (v) m[d.id] = v; });
    S.ops = m; setModo('equipo'); render();
  }, () => setModo('local', 'No he podido leer el estado del equipo en esta vista.'));
}
function guardar(id, patch){
  const next = Object.assign({}, op(id), patch);
  delete next.estado;
  next.upd = new Date().toISOString();
  if (IMAP[id]) next.tit = IMAP[id].titular.slice(0,120);
  S.ops[id] = next;
  render();
  if (DB) DB.doc('ops/' + id).set(next).catch(e =>
    setModo('local', 'Se rechazó la escritura (' + (e && e.code || 'error') + ').'));
  else { try { localStorage.setItem('explora.ops', JSON.stringify(S.ops)); } catch(e){} }
}
function borrar(id){
  delete S.ops[id]; render();
  if (DB) DB.doc('ops/' + id).delete().catch(() => {});
  else { try { localStorage.setItem('explora.ops', JSON.stringify(S.ops)); } catch(e){} }
}
try { const raw = localStorage.getItem('explora.ops'); if (raw) S.ops = JSON.parse(raw); } catch(e){}

/* ===================== derivados ===================== */
function datosDe(it){ return it.datos.map(d => DMAP[d]); }
function datosSugDe(it){ return it.datosSug.map(d => DMAP[d]); }
function bloqueo(it){
  return it.datos.concat(it.datosSug).map(d => DMAP[d]).find(d => d && /^BAJA/.test(d.confianza)) || null;
}
function nFiltros(){ return Object.values(S.f).filter(Boolean).length; }
/* un solo sitio decide si una idea pasa los filtros. `salvo` deja fuera una
   dimensión, para poder contar cuántas quedarían al elegir cada opción.   */
function pasa(it, salvo){
  const f = S.f, tokens = trozosBusqueda();
  /* todas las palabras deben aparecer, en cualquier orden y en cualquier campo */
  if (tokens.length && !tokens.every(t => it.buscar.indexOf(t) >= 0)) return false;
  if (sit(it.id) === 'hecha') return false;   // lo hecho vive en Inventario
  /* Filtrar por rama o por ciclo no es «etiquetada así»: es «me sirve para esto».
     Una transversal vale para cualquier rama, y una de toda la rama vale para
     cualquiera de sus ciclos.                                                */
  if (salvo !== 'rama' && f.rama){
    if (S.t.solo){ if (it.ramaColor !== f.rama) return false; }
    else if (!(it.ramaColor === f.rama || it.alcTipo === 'transversal')) return false;
  }
  if (salvo !== 'form' && f.form){
    if (S.t.solo){ if (afinidad(it, f.form) !== 1) return false; }
    else if (!sirveAl(it, f.form)) return false;
  }
  if (salvo !== 'cif'  && f.cif  && cifraDe(it) !== f.cif) return false;
  return true;
}
/* cómo de específica es una idea para el ciclo elegido: 1 es la suya, 4 es
   una transversal que también le sirve */
function ramaDelCiclo(ciclo){
  const i = IDEAS.find(x => x.alcTipo === 'formacion' && x.alcTxt === ciclo);
  return i ? i.ramaColor : '';
}
function afinidad(it, ciclo){
  if (it.alcTipo === 'formacion') return it.alcTxt === ciclo ? 1 : 0;
  const rama = ramaDelCiclo(ciclo);
  if (it.alcTipo === 'varias') return it.ramaColor === rama ? 2 : 0;
  if (it.alcTipo === 'rama')   return it.ramaColor === rama ? 3 : 0;
  return 4;   // transversal: le sirve a todo el mundo
}
function sirveAl(it, ciclo){ return afinidad(it, ciclo) > 0; }
function filtradas(){ return IDEAS.filter(it => pasa(it)); }
function cuenta(dim, valor, campo){
  return IDEAS.filter(it => pasa(it, dim) && (campo === 'cif' ? cifraDe(it) : it[campo]) === valor).length;
}
function hechas(){
  return IDEAS.map(it => ({it, o: op(it.id)})).filter(x => sit(x.it.id) === 'hecha')
    .sort((a,b) => (b.o.fecha||'').localeCompare(a.o.fecha||''));
}

/* Reglas del orden, en un solo sitio:
   1) las repetidas siempre al final
   2) por la columna elegida
   3) a igualdad, alfabético por el titular                       */
const ORDEN_ALC = {transversal:0, rama:1, varias:2, formacion:3};
const ORDEN_FUN = {TOFU:0, MOFU:1, BOFU:2};
const ORDEN_CIF = {sin:0, listo:1, repasar:2, comprobar:3, nopublicar:4};
function ordenar(a, b){
  let d = 0;
  if (S.orden === 'alcance'){
    if (S.f.form)      d = afinidad(a, S.f.form) - afinidad(b, S.f.form);
    else if (S.f.rama) d = ORDEN_ALC[b.alcTipo] - ORDEN_ALC[a.alcTipo];   // lo concreto arriba
    else               d = ORDEN_ALC[a.alcTipo] - ORDEN_ALC[b.alcTipo];
    d = d || a.ramaColor.localeCompare(b.ramaColor, 'es') || a.alcTxt.localeCompare(b.alcTxt, 'es');
  }
  else if (S.orden === 'idea')    d = a.titular.localeCompare(b.titular, 'es');
  else if (S.orden === 'piensa')  d = a.gancho.localeCompare(b.gancho, 'es');
  else if (S.orden === 'momento') d = ORDEN_FUN[a.funnel] - ORDEN_FUN[b.funnel];
  else if (S.orden === 'cifras')  d = ORDEN_CIF[cifraDe(a)] - ORDEN_CIF[cifraDe(b)];
  return d || a.titular.localeCompare(b.titular, 'es');
}
function vIdeas(){

  let detalle = '';
  if (foco){

    '<th class="c-acc"></th>' +

  return h;
}
const CIF = {listo:'Dato listo', comprobar:'Comprobar', repasar:'Repasar', sin:'Sin cifras', nopublicar:'No publicar'};
function cifraDe(it){
  if (it.bloqueada) return 'nopublicar';
  if (it.datos.length) return 'listo';

  if (it.verificar === 'MEDIO') return 'repasar';

    '<span class="puntos"></span>' +
    '<button class="btn" id="onbCerrar">Cancelar</button>' +
    '<button class="btn pri" id="nc-guardar" data-id="' + esc(id || '') + '">Guardar</button></footer></div>';
}
function guardarCarrusel(id){
  const tit = $('#nc-tit').value.trim();
  if (!tit){ toast('Ponle al menos un título'); return; }
  const datos = {propio:true, hecho:true, titular:tit, tit:tit,
    url: $('#nc-url').value.trim(), fecha: $('#nc-fecha').value,
    rama: $('#nc-rama').value, notas: $('#nc-notas').value.trim(), checks:{}};
  const dest = id || nuevoId();
  S.ops[dest] = Object.assign({}, S.ops[dest] || {}, datos, {upd:new Date().toISOString()});
  const cuerpo = S.ops[dest];
  if (DB) DB.doc('ops/' + dest).set(cuerpo).catch(() => setModo('local','No he podido guardar en el estado del equipo.'));
  else { try { localStorage.setItem('explora.ops', JSON.stringify(S.ops)); } catch(e){} }
  cerrarPanel(); render(); toast(id ? 'Carrusel actualizado' : 'Carrusel añadido al inventario');
}

/* ---------- DATOS ---------- */
function vDatos(){
  const caducado = hoy() > CADUCA;
  let h = '<div class="vhead"><div class="vtxt"><h2>Datos que puedes citar</h2>' +
    '<p>Los 16 hechos con fuente comprobada. Si una cifra no está aquí, no sale en un carrusel.</p></div></div>';
  h += caducado
    ? '<div class="aviso-fila rojo" style="margin-bottom:14px"><b>Toca revisar.</b> Han pasado más de seis meses desde ' + CONSULTA + '.</div>'
    : '<div class="aviso-fila ambar" style="margin-bottom:14px"><b>Próxima revisión: marzo de 2027.</b> Después de esa fecha, ninguna cifra sale sin recomprobar.</div>';
  h += '<div class="datos">' + DATOS.map(d => {
    const conf = /^BAJA/.test(d.confianza), vinc = d.ideas.concat(d.ideasSug);
    return '<article class="dato' + (conf ? ' conflicto' : '') + '">' +
      '<div class="dtop"><span class="did">' + esc(d.id) + '</span>' +
        '<span class="chip ' + (conf ? 'bloq' : d.confianza === 'ALTA' ? 's-hecha' : 'v-MEDIO') + '">' +
        (conf ? 'no lo uses todavía' : d.confianza === 'ALTA' ? 'fiable' : 'con matices') + '</span></div>' +
      '<h3>' + esc(d.tema) + '</h3><p class="frase">' + esc(d.frase) + '</p>' +
      '<dl><dt>Norma</dt><dd>' + esc(d.norma) + '</dd>' +
      '<dt>Fuente</dt><dd>' + esc(d.fuente) + ' · <a href="' + esc(d.url) + '" target="_blank" rel="noopener">abrir</a></dd></dl>' +
      '<p class="aviso"><b>Cuidado:</b> ' + esc(d.aviso) + '</p>' +
      (vinc.length ? '<p class="vinc">Lo usan: ' + vinc.slice(0,10).map(id =>
        '<button data-abrir="' + id + '">' + id + '</button>').join(' ') +
        (vinc.length > 10 ? ' +' + (vinc.length-10) : '') + '</p>' : '') +
      '</article>';
  }).join('') + '</div>';
  return h;
}

/* ===================== ficha ===================== */
function abrir(id){ S.sel = id; $('#velo').classList.add('on'); $('#drawer').classList.add('on');
  $('#drawer').setAttribute('aria-hidden','false'); pintarFicha(); $('#dbody').scrollTop = 0; }
function cerrar(){ S.sel = null; $('#velo').classList.remove('on'); $('#drawer').classList.remove('on');
  $('#drawer').setAttribute('aria-hidden','true'); render(); }
function pintarFicha(){
  const it = IMAP[S.sel]; if (!it) return;
  const o = op(it.id), s = sit(it.id), bl = bloqueo(it);
  $('#dhead').innerHTML = '<div class="drow">' + chipAlcance(it) +
    (deTemporada(it) ? '<span class="chip temp">' + esc(MESES[mesActual()]) + '</span>' : '') +
    '<span class="nslides">' + slides(it).length + ' slides</span>' +
    '<button class="dclose" id="cerrarFicha" aria-label="Cerrar">✕</button></div>' +
    '<h2>' + esc(it.titular) + '</h2>';

  let b = '';
  if (bl) b += '<div class="alerta"><b>No la publiques todavía</b>Se apoya en el dato ' + esc(bl.id) + ' (' + esc(bl.tema) +
    '), cuyas fuentes se contradicen. ' + esc(bl.aviso) + '</div>';

  b += '<div class="sec"><h4>' + esc(it.ganchoLabel) + '</h4><p class="quote">' + esc(it.gancho) + '</p></div>';
  b += '<div class="sec"><h4>De qué va</h4><p class="resumen">' + esc(it.dentro) + '</p></div>';

  b += '<div class="sec tecnica"><div class="tec">' +
      '<span><k>Alcance</k>' + esc(it.alcTxt) + '</span>' +
      (it.nivel ? '<span><k>Nivel</k>' + esc(NIVEL[it.nivel] || it.nivel) + '</span>' : '') +
      '<span><k>Funnel</k>' + esc(it.funnel) + '</span>' +
      '<span><k>Cifras</k>' + esc(CIF[cifraDe(it)]) + '</span>' +
      '<span><k>Código</k>' + esc(it.id) + (it.tambienEn && it.tambienEn.length ? ' + ' + esc(it.tambienEn.join(', ')) : '') + '</span>' +
      (o.url ? '<span><k>Slides</k><a href="' + esc(o.url) + '" target="_blank" rel="noopener">Drive</a></span>' : '') +
      (o.fecha ? '<span><k>Publicado</k>' + esc(fCorta(o.fecha)) + '</span>' : '') +
    '</div></div>';

  $('#dbody').innerHTML = b;
  $('#dfoot').innerHTML =
    '<button class="btn pri" data-prompt="' + it.id + '">Copiar el prompt</button>' +
    '<button class="btn hecho' + (s === 'hecha' ? ' on' : '') + '" data-hecho="' + it.id + '">' +
      (s === 'hecha' ? '✓ Hecho' : 'Marcar hecho') + '</button>';
}
function campo(label, inner, full){
  return '<div class="campo' + (full ? ' full' : '') + '"><label>' + esc(label) + '</label>' + inner + '</div>';
}

/* ===================== ayuda ===================== */
/* ===================== eventos ===================== */
function cerrarPanel(){ $('#onb').hidden = true; $('#onb').innerHTML = ''; }
function marcarHecho(id){
  if (sit(id) === 'hecha'){
    if (!confirm('¿Devolverla a la lista de ideas por hacer?')) return;
    guardar(id, {hecho:false});
    toast('Vuelve a la lista de ideas');
    return;
  }
  formHecho(id);   // sin enlace de Drive no pasa al inventario
}
function formHecho(id){
  const it = IMAP[id], o = op(id);
  $('#onb').hidden = false;
  $('#onb').innerHTML = '<div class="onbcaja" role="dialog" aria-modal="true" aria-label="Pasar al inventario">' +
    '<header><k>Pasar al inventario</k><h2>' + esc(it.titular) + '</h2></header>' +
    '<div class="cuerpo"><p>Pega el enlace a la carpeta de Drive con las slides. ' +
    'Es lo que convierte el inventario en algo que sirve: sin él no se puede volver al archivo.</p>' +
    '<div class="campos">' +
    campo('Carpeta de Drive con las slides', '<input id="mh-url" value="' + esc(o.url) + '" placeholder="https://drive.google.com/drive/folders/…">', true) +
    campo('Día', '<input type="date" id="mh-fecha" value="' + esc(o.fecha || fISO(hoy())) + '">') +
    '</div><p id="mh-error" class="mherror" hidden></p></div>' +
    '<footer><span class="puntos"></span>' +
    '<button class="btn" id="onbCerrar">Cancelar</button>' +
    '<button class="btn pri" id="mh-guardar" data-id="' + esc(id) + '">Pasar al inventario</button></footer></div>';
  const i = $('#mh-url'); if (i) i.focus();
}
function guardarHecho(id){
  const url = ($('#mh-url').value || '').trim();
  const err = $('#mh-error');
  if (!url || !/^https?:\/\/\S+\.\S+/.test(url)){
    err.hidden = false;
    err.textContent = url ? 'Eso no parece una dirección web. Debe empezar por https://'
                          : 'Falta el enlace a Drive. Sin él no puede pasar al inventario.';
    $('#mh-url').focus(); return;
  }
  guardar(id, {hecho:true, url:url, fecha: $('#mh-fecha').value || fISO(hoy())});
  cerrarPanel();
  if (S.sel === id) cerrar();
  toast('En el inventario');
}
const _render = render;
render = function(){ _render(); setModo(S.modo); };

document.addEventListener('click', e => {
  const t = e.target;
  const pr = t.closest('[data-prompt]');
  if (pr){ copiar(promptDesign(IMAP[pr.dataset.prompt]), 'Prompt copiado'); return; }
  const hc = t.closest('[data-hecho]'); if (hc){ marcarHecho(hc.dataset.hecho); return; }
  const ab = t.closest('[data-abrir]'); if (ab){ abrir(ab.dataset.abrir); return; }
  if (t.id === 'cerrarFicha' || t.id === 'velo'){ cerrar(); return; }
  const vb = t.closest('#vistas button');
  if (vb){ S.v = vb.dataset.v; S.q = '';
    document.querySelectorAll('#vistas button').forEach(x => x.setAttribute('aria-current', String(x === vb)));
    render(); window.scrollTo({top:0}); return; }
  const ir = t.closest('[data-ir]');
  if (ir){
    S.v = ir.dataset.ir; S.q = '';
    document.querySelectorAll('#vistas button').forEach(x => x.setAttribute('aria-current', String(x.dataset.v === S.v)));
    render(); window.scrollTo({top:0}); return;
  }
  const so = t.closest('[data-solo]');
  if (so){ S.t.solo = so.dataset.solo === '1'; render(); return; }
  const fi = t.closest('[data-filtra]');
  if (fi){
    const [clave, valor] = fi.dataset.filtra.split(':');
    const campo = clave === 'cif' ? 'cif' : 'rama';
    S.f[campo] = S.f[campo] === valor ? '' : valor;
    render(); return;
  }
  if (t.id === 'limpiar'){ S.f = {rama:'', form:'', cif:''}; S.t.solo = false; S.q = ''; S.orden = 'alcance';
    S.t.dato = S.t.rapida = S.t.bloq = false; S.q = ''; render(); return; }
  if (t.id === 'onbCerrar'){ cerrarPanel(); return; }
  if (t.id === 'nuevoCarrusel'){ formCarrusel(''); return; }
  const ed = t.closest('[data-editar]'); if (ed){ formCarrusel(ed.dataset.editar); return; }
  if (t.id === 'nc-guardar'){ guardarCarrusel(t.dataset.id || ''); return; }
  if (t.id === 'nc-borrar'){
    const g = document.querySelector('#nc-guardar');
    if (g && confirm('¿Quitar este carrusel del inventario?')){ borrar(g.dataset.id); cerrarPanel(); toast('Quitado del inventario'); }
    return; }
  if (t.id === 'mh-guardar'){ guardarHecho(t.dataset.id); return; }
  if (t.id === 'tema'){ const cur = document.documentElement.getAttribute('data-theme');
    const oscuro = cur ? cur === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.setAttribute('data-theme', oscuro ? 'light' : 'dark'); return; }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset && t.dataset.dim){
    S.f[t.dataset.dim] = t.value;
    if (t.dataset.dim === 'rama') S.f.form = '';   // el ciclo cuelga de la rama
    if (!S.f.rama && !S.f.form) S.t.solo = false;
    render(); return;
  }
  if (t.dataset && t.dataset.f){ S.f[t.dataset.f] = t.value; render(); return; }
  if (t.dataset && t.dataset.url){ guardar(t.dataset.url, {url: t.value.trim()}); return; }
  if (t.dataset && t.dataset.c && S.sel){ const p = {}; p[t.dataset.c] = t.value; guardar(S.sel, p); return; }
  if (t.dataset && t.dataset.chk && S.sel){
    const o = op(S.sel); o.checks[t.dataset.chk] = t.checked; guardar(S.sel, {checks:o.checks}); return; }
});
let tq;
document.addEventListener('input', e => {
  if (e.target.id !== 'buscar') return;
  clearTimeout(tq); const v = e.target.value;
  tq = setTimeout(() => { S.q = v; render();
    const i = $('#buscar'); if (i){ i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }, 220);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){ if (!$('#onb').hidden) cerrarPanel(); else if (S.sel) cerrar(); }
  if (e.key === '/' && document.activeElement !== $('#buscar')){
    const i = $('#buscar'); if (i){ e.preventDefault(); i.focus(); } }
});

/* ===================== arranque ===================== */
render();
conectar();
</script>
</body></html>
